openapi: 3.0.3
info:
  title: Súbete · rutas-crud
  version: 0.3.0
  description: |
    CRUD de rutas del grupo A. Es el único dueño de MongoDB.

    Publica, lista, edita, cierra y ajusta cupos de rutas. Los puntos
    geográficos usan el orden de GeoJSON `[longitud, latitud]` y las fechas de
    salida se guardan y devuelven en UTC.

    El contrato es ejecutable desde el visor OpenAPI: levanta MongoDB y el
    proceso, abre una operación y usa `Try it out`. El visor corre por defecto
    en `http://127.0.0.1:8090` y el CRUD autoriza ese origen por CORS
    (configurable con `CORS_ORIGINS`); las fechas de los ejemplos son futuras
    para que `POST /rutas` funcione sin editarlas.

    Identidad y gateway (provisional, pendiente de acuerdo con el clúster):
    las operaciones de edición y cierre leen la identidad de la cabecera
    `X-Usuario-Id` y exigen que coincida con `conductorId`. Si el proceso
    define `GATEWAY_SECRET`, toda petición distinta de `/health` debe traer
    `X-Cluster-Secret`. Mientras esos acuerdos no existan, `POST /rutas` sigue
    aceptando `conductorId` en el cuerpo y la comprobación del secreto está
    desactivada por defecto.

    Idempotencia de cupos: queda pendiente con Reservas. El contrato actual
    mantiene `delta` y no acepta todavía una clave de idempotencia.
servers:
  - url: http://127.0.0.1:8081
    description: Proceso local del CRUD, usado por el visor OpenAPI
tags:
  - name: salud
  - name: rutas
paths:
  /health:
    get:
      operationId: health
      tags: [salud]
      summary: Comprueba que el proceso HTTP responde
      responses:
        '200':
          description: Servicio activo
          content:
            application/json:
              schema:
                type: object
                required: [status, service]
                properties:
                  status:
                    type: string
                    enum: [ok]
                  service:
                    type: string
                    enum: [rutas-crud]
  /rutas:
    get:
      operationId: listarRutas
      tags: [rutas]
      summary: Lista rutas con filtros y paginación
      description: |
        Devuelve las rutas ordenadas por `salida` ascendente y, ante empate,
        por `id` ascendente. `desde` y `hasta` son inclusivos y se interpretan
        en UTC. Sin filtros devuelve la primera página de todas las rutas.

        El MID de rutas usa esta operación con `estado=abierta` y la ventana de
        salida para preseleccionar candidatas; el panel del conductor la usa
        con `conductorId`.
      parameters:
        - name: conductorId
          in: query
          required: false
          description: Filtra por conductor propietario
          schema:
            type: string
            minLength: 1
            example: usr-12
        - name: estado
          in: query
          required: false
          description: Filtra por estado publicado
          schema:
            type: string
            enum: [abierta, llena, cerrada]
        - name: desde
          in: query
          required: false
          description: Salida mayor o igual a este instante, en RFC3339
          schema:
            type: string
            format: date-time
            example: '2030-01-15T00:00:00Z'
        - name: hasta
          in: query
          required: false
          description: Salida menor o igual a este instante, en RFC3339
          schema:
            type: string
            format: date-time
            example: '2030-01-16T00:00:00Z'
        - name: limit
          in: query
          required: false
          description: Tamaño de página; por defecto 20
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: offset
          in: query
          required: false
          description: Cantidad de rutas a omitir; por defecto 0
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        '200':
          description: Página de rutas
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListaRutas'
        '400':
          $ref: '#/components/responses/SolicitudInvalida'
        '500':
          $ref: '#/components/responses/ErrorInterno'
    post:
      operationId: crearRuta
      tags: [rutas]
      summary: Publica una ruta con su trazado
      description: |
        Crea la ruta en estado `abierta` con `cuposDisponibles` igual a
        `cuposTotales`. El identificador, la disponibilidad inicial y el estado
        los asigna el servidor.

        Rechaza `cuposTotales` fuera de 1 a 6, `precioTotal` negativo, `salida`
        que no sea futura, coordenadas fuera de rango y trazados con menos de
        dos puntos.

        Si la petición trae `X-Usuario-Id`, debe coincidir con `conductorId`;
        en caso contrario responde 403 `no_autorizado`.
      parameters:
        - $ref: '#/components/parameters/UsuarioIdOpcional'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CrearRuta'
            example:
              conductorId: usr-12
              origen:
                nombre: Chapinero
                punto:
                  type: Point
                  coordinates: [-74.0645, 4.6486]
              destino:
                nombre: Universidad
                punto:
                  type: Point
                  coordinates: [-74.0415, 4.7012]
              trazado:
                type: LineString
                coordinates:
                  - [-74.0645, 4.6486]
                  - [-74.0600, 4.6650]
                  - [-74.0415, 4.7012]
              salida: '2030-01-15T06:30:00Z'
              cuposTotales: 3
              precioTotal: 12000
      responses:
        '201':
          description: Ruta creada
          headers:
            Location:
              description: URI del recurso creado
              schema:
                type: string
                example: /rutas/ruta-1a2b3c4d5e6f7a8b
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ruta'
        '400':
          $ref: '#/components/responses/SolicitudInvalida'
        '403':
          $ref: '#/components/responses/NoAutorizado'
        '500':
          $ref: '#/components/responses/ErrorInterno'
  /rutas/{id}:
    parameters:
      - $ref: '#/components/parameters/RutaId'
    get:
      operationId: obtenerRuta
      tags: [rutas]
      summary: Consulta el detalle de una ruta
      description: |
        Devuelve la ruta indicada. Usa el `id` que devolvió `POST /rutas`
        para encadenar la ejecución desde el visor OpenAPI.

        Es la operación que consume el MID de Reservas con el scope
        `rutas:leer`.
      responses:
        '200':
          description: Ruta encontrada
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ruta'
        '404':
          $ref: '#/components/responses/NoEncontrada'
        '500':
          $ref: '#/components/responses/ErrorInterno'
    put:
      operationId: actualizarRuta
      tags: [rutas]
      summary: Edita una ruta existente
      description: |
        Reemplaza los datos editables de la ruta. `conductorId` no se puede
        cambiar y la identidad de `X-Usuario-Id` debe ser la propietaria.

        Aplica las mismas reglas de `POST /rutas`. Además, el nuevo
        `cuposTotales` no puede ser menor que los cupos ya comprometidos
        (`cuposTotales - cuposDisponibles`): en ese caso responde 409
        `reservas_activas`. Los cupos disponibles se recalculan como
        `nuevo cuposTotales - cupos comprometidos` y el estado pasa a `llena`
        si el resultado es cero o a `abierta` en caso contrario.

        Una ruta `cerrada` no se puede editar: responde 409 `ruta_cerrada`.
        La comprobación de propiedad, estado y cupos comprometidos se aplica en
        la misma escritura condicional que actualiza el documento.
      parameters:
        - $ref: '#/components/parameters/UsuarioId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActualizarRuta'
            example:
              origen:
                nombre: Chapinero
                punto:
                  type: Point
                  coordinates: [-74.0645, 4.6486]
              destino:
                nombre: Universidad
                punto:
                  type: Point
                  coordinates: [-74.0415, 4.7012]
              trazado:
                type: LineString
                coordinates:
                  - [-74.0645, 4.6486]
                  - [-74.0600, 4.6650]
                  - [-74.0415, 4.7012]
              salida: '2030-01-15T07:00:00Z'
              cuposTotales: 4
              precioTotal: 14000
      responses:
        '200':
          description: Ruta actualizada
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ruta'
        '400':
          $ref: '#/components/responses/SolicitudInvalida'
        '403':
          $ref: '#/components/responses/NoAutorizado'
        '404':
          $ref: '#/components/responses/NoEncontrada'
        '409':
          description: |
            La edición no se puede aplicar. Códigos: `ruta_cerrada` si la ruta
            ya está cerrada y `reservas_activas` si el nuevo total de cupos
            dejaría por debajo los cupos comprometidos.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                reservasActivas:
                  value:
                    codigo: reservas_activas
                    mensaje: La ruta tiene cupos comprometidos por reservas
                    detalle:
                      rutaId: ruta-1a2b3c4d5e6f7a8b
        '500':
          $ref: '#/components/responses/ErrorInterno'
    delete:
      operationId: cerrarRuta
      tags: [rutas]
      summary: Cierra lógicamente una ruta
      description: |
        Marca la ruta como `cerrada` sin borrar el documento. La identidad de
        `X-Usuario-Id` debe ser la propietaria.

        Si la ruta tiene cupos comprometidos responde 409 `reservas_activas`:
        no se puede dejar a pasajeros con una reserva activa sin ruta. Cerrar
        una ruta ya cerrada es idempotente y responde 204.

        Es la operación que evita que Reservas descuente cupos de una ruta que
        el conductor dejó de ofrecer.
      parameters:
        - $ref: '#/components/parameters/UsuarioId'
      responses:
        '204':
          description: Ruta cerrada
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
        '403':
          $ref: '#/components/responses/NoAutorizado'
        '404':
          $ref: '#/components/responses/NoEncontrada'
        '409':
          description: La ruta tiene cupos comprometidos por reservas
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                codigo: reservas_activas
                mensaje: La ruta tiene cupos comprometidos por reservas
                detalle:
                  rutaId: ruta-1a2b3c4d5e6f7a8b
        '500':
          $ref: '#/components/responses/ErrorInterno'
  /rutas/{id}/cupos:
    parameters:
      - $ref: '#/components/parameters/RutaId'
    patch:
      operationId: ajustarCupos
      tags: [rutas]
      summary: Descuenta o devuelve cupos de una ruta
      description: |
        Aplica `delta` en una sola escritura condicional del documento. Con
        valores negativos exige que la ruta esté `abierta` y que haya cupos
        suficientes. Con valores positivos acepta rutas `abiertas` o `llenas` y
        no permite superar `cuposTotales`.

        Usa el `id` que devolvió `POST /rutas` para encadenar la ejecución
        desde el visor OpenAPI.

        La disponibilidad y el estado cambian juntos: al llegar a cero la ruta
        pasa a `llena` y al devolver un cupo vuelve a `abierta`. Dos solicitudes
        simultáneas por el último cupo producen un `200` y un `409 sin_cupos`.

        Es la operación que consume el MID de Reservas con el scope
        `rutas:escribir`. La clave de idempotencia para reintentos sigue
        pendiente de acuerdo con Reservas.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AjusteCupos'
            example:
              delta: -1
      responses:
        '200':
          description: Ruta con la disponibilidad y el estado actualizados
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ruta'
        '400':
          $ref: '#/components/responses/SolicitudInvalida'
        '404':
          $ref: '#/components/responses/NoEncontrada'
        '409':
          description: |
            El ajuste no cumple una condición de inventario. Códigos:
            `sin_cupos` cuando un descuento no encuentra disponibilidad
            (incluido un descuento sobre una ruta cerrada), `cupos_excedidos`
            cuando una devolución supera el total y `ruta_cerrada` cuando se
            intenta devolver cupos a una ruta cerrada.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                sinCupos:
                  value:
                    codigo: sin_cupos
                    mensaje: La ruta no tiene cupos disponibles
                    detalle:
                      rutaId: ruta-1a2b3c4d5e6f7a8b
        '500':
          $ref: '#/components/responses/ErrorInterno'
components:
  headers:
    X-Request-Id:
      description: Identificador de la solicitud, propio o generado por el servidor; también viaja en las respuestas de error
      schema:
        type: string
  parameters:
    RutaId:
      name: id
      in: path
      required: true
      description: Identificador de la ruta
      schema:
        type: string
        pattern: '^ruta-[a-z0-9]+$'
        example: ruta-1a2b3c4d5e6f7a8b
    UsuarioId:
      name: X-Usuario-Id
      in: header
      required: true
      description: |
        Identidad autenticada del conductor, inyectada por el gateway. Nombre
        provisional hasta que el clúster acuerde la cabecera definitiva. Debe
        coincidir con el `conductorId` de la ruta.
      schema:
        type: string
        minLength: 1
        example: usr-12
    UsuarioIdOpcional:
      name: X-Usuario-Id
      in: header
      required: false
      description: |
        Identidad autenticada del conductor. En `POST /rutas` es opcional
        mientras el gateway no esté integrado; si llega, debe coincidir con el
        `conductorId` del cuerpo. Nombre provisional.
      schema:
        type: string
        minLength: 1
        example: usr-12
  responses:
    SolicitudInvalida:
      description: Cuerpo, consulta o campos inválidos
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            codigo: solicitud_invalida
            mensaje: 'cuposTotales debe estar entre 1 y 6'
            detalle:
              campo: cuposTotales
    NoEncontrada:
      description: La ruta no existe
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            codigo: no_encontrada
            mensaje: La ruta no existe
            detalle:
              rutaId: ruta-1a2b3c4d5e6f7a8b
    NoAutorizado:
      description: |
        La identidad no es la propietaria de la ruta o falta la cabecera de
        identidad. Con `GATEWAY_SECRET` definida, una petición sin
        `X-Cluster-Secret` válida responde 401 con el mismo código.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            codigo: no_autorizado
            mensaje: La identidad autenticada no es la propietaria de la ruta
            detalle:
              rutaId: ruta-1a2b3c4d5e6f7a8b
    ErrorInterno:
      description: Fallo inesperado del servidor
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            codigo: error_interno
            mensaje: No fue posible completar la solicitud
            detalle: {}
  schemas:
    Ruta:
      type: object
      additionalProperties: false
      required:
        - id
        - conductorId
        - origen
        - destino
        - trazado
        - salida
        - cuposTotales
        - cuposDisponibles
        - precioTotal
        - estado
      properties:
        id:
          type: string
          pattern: '^ruta-[a-z0-9]+$'
          example: ruta-1a2b3c4d5e6f7a8b
        conductorId:
          type: string
          minLength: 1
          example: usr-12
        origen:
          $ref: '#/components/schemas/Lugar'
        destino:
          $ref: '#/components/schemas/Lugar'
        trazado:
          $ref: '#/components/schemas/LineString'
        salida:
          type: string
          format: date-time
          description: Fecha de salida en UTC
          example: '2030-01-15T06:30:00Z'
        cuposTotales:
          type: integer
          minimum: 1
          maximum: 6
          example: 3
        cuposDisponibles:
          type: integer
          minimum: 0
          maximum: 6
          example: 3
        precioTotal:
          type: integer
          format: int64
          minimum: 0
          description: Precio total del viaje en pesos
          example: 12000
        estado:
          type: string
          enum: [abierta, llena, cerrada]
    ListaRutas:
      type: object
      additionalProperties: false
      required: [items, total, limit, offset]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Ruta'
        total:
          type: integer
          minimum: 0
          description: Total de rutas que cumplen los filtros, sin paginar
          example: 15
        limit:
          type: integer
          minimum: 1
          example: 20
        offset:
          type: integer
          minimum: 0
          example: 0
    CrearRuta:
      type: object
      additionalProperties: false
      required:
        - conductorId
        - origen
        - destino
        - trazado
        - salida
        - cuposTotales
        - precioTotal
      properties:
        conductorId:
          type: string
          minLength: 1
          example: usr-12
        origen:
          $ref: '#/components/schemas/Lugar'
        destino:
          $ref: '#/components/schemas/Lugar'
        trazado:
          $ref: '#/components/schemas/LineString'
        salida:
          type: string
          format: date-time
          description: Debe ser futura. Se normaliza a UTC.
          example: '2030-01-15T06:30:00Z'
        cuposTotales:
          type: integer
          minimum: 1
          maximum: 6
          example: 3
        precioTotal:
          type: integer
          format: int64
          minimum: 0
          example: 12000
    ActualizarRuta:
      type: object
      additionalProperties: false
      required:
        - origen
        - destino
        - trazado
        - salida
        - cuposTotales
        - precioTotal
      properties:
        origen:
          $ref: '#/components/schemas/Lugar'
        destino:
          $ref: '#/components/schemas/Lugar'
        trazado:
          $ref: '#/components/schemas/LineString'
        salida:
          type: string
          format: date-time
          description: Debe ser futura. Se normaliza a UTC.
          example: '2030-01-15T07:00:00Z'
        cuposTotales:
          type: integer
          minimum: 1
          maximum: 6
          description: No puede quedar por debajo de los cupos comprometidos.
          example: 4
        precioTotal:
          type: integer
          format: int64
          minimum: 0
          example: 14000
    Lugar:
      type: object
      additionalProperties: false
      required: [nombre, punto]
      properties:
        nombre:
          type: string
          minLength: 1
          example: Chapinero
        punto:
          $ref: '#/components/schemas/Point'
    Point:
      type: object
      additionalProperties: false
      required: [type, coordinates]
      properties:
        type:
          type: string
          enum: [Point]
        coordinates:
          type: array
          description: 'Orden GeoJSON: [longitud, latitud]. Longitud entre -180 y 180; latitud entre -90 y 90.'
          minItems: 2
          maxItems: 2
          items:
            type: number
          example: [-74.0645, 4.6486]
    LineString:
      type: object
      additionalProperties: false
      required: [type, coordinates]
      properties:
        type:
          type: string
          enum: [LineString]
        coordinates:
          type: array
          description: 'Orden GeoJSON: cada posición es [longitud, latitud], con longitud entre -180 y 180 y latitud entre -90 y 90.'
          minItems: 2
          items:
            type: array
            minItems: 2
            maxItems: 2
            items:
              type: number
          example:
            - [-74.0645, 4.6486]
            - [-74.0600, 4.6650]
            - [-74.0415, 4.7012]
    AjusteCupos:
      type: object
      additionalProperties: false
      required: [delta]
      properties:
        delta:
          type: integer
          minimum: -6
          maximum: 6
          not:
            enum: [0]
          description: Negativo descuenta, positivo devuelve. No puede ser cero; la magnitud máxima es 6.
          example: -1
    Error:
      type: object
      additionalProperties: false
      required: [codigo, mensaje, detalle]
      properties:
        codigo:
          type: string
          description: Código estable para clientes
          enum:
            - solicitud_invalida
            - no_encontrada
            - sin_cupos
            - cupos_excedidos
            - ruta_cerrada
            - no_autorizado
            - reservas_activas
            - error_interno
          example: sin_cupos
        mensaje:
          type: string
          example: La ruta no tiene cupos disponibles
        detalle:
          type: object
          additionalProperties: true
          description: Contexto del error; nunca incluye tokens ni datos de pasajeros
          example: {}
